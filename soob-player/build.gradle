plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'info.dynart.soob'
    compileSdk 36
    ndkVersion '29.0.13846066'

    defaultConfig {
        minSdk 27
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            cmake {
                // Lua is C89 and warning-clean at -O2; the bridge follows it.
                arguments '-DANDROID_STL=none'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig false
    }
}
