plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Publishable coordinates. Nothing is published to a repository today, but a
// composite build substitutes by group:name — a game in its own repo that does
//     includeBuild '../SOOB-Core-Android'
// and asks for 'net.dynart.soob:soob-player' only gets this project if these
// two lines exist. (LisaEngine carries the same pair for CoolFox.)
group = 'net.dynart.soob'
version = '0.1.0'

android {
    namespace 'net.dynart.soob'
    compileSdk 36
    ndkVersion '29.0.13846066'

    defaultConfig {
        minSdk 27
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            cmake {
                // Lua is C89 and warning-clean at -O2; the bridge follows it.
                arguments '-DANDROID_STL=none'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
