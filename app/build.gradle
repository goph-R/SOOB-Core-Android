plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The only per-game line in this file. Everything else — SDK levels, signing,
// noCompress, the :soob-player dependency, the game-bundle sync — is in
// gradle/soobApp.gradle; the game's name, icon colour and orientation come from
// the bundle's app.lua.
def appId = 'info.dynart.find5'

android {
    namespace appId
    defaultConfig {
        applicationId appId
        versionCode 1
        versionName '0.1.0'
    }
}

apply from: rootProject.file('gradle/soobApp.gradle')
